# Defaults that are compiled into the app. See "Configuration" in README.md.
configVersion=2

recognizerUrl=wss://diktuj.serbskidom.de/
recognizerSampleRate=48000
continuousRecognition=true
recognitionLanguages=hsb

# ttsProtocol is "bamborak" or "simple"
ttsUrl=https://bamborakapi.mudrowak.de/api/tts/
ttsProtocol=bamborak
ttsSpeakerId=weronika
ttsLanguages=hsb

# Lower Sorbian is offered once these are filled in and dsb is added to the
# language lists above.
dsbRecognizerUrl=
dsbTtsUrl=
dsbTtsProtocol=bamborak
dsbTtsSpeakerId=
